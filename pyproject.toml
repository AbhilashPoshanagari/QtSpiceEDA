[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtspice"
version = "0.0.1"
description = "QtSpice: a small desktop EDA app (netlists, ngspice, waveforms, function blocks)"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6~=6.8.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.scripts]
qtspice = "app.__main__:main"

# Lets Qt Creator open this file as a project. Add new source files here.
[tool.pyside6-project]
files = [
    "app/__init__.py",
    "app/__main__.py",
    "bridge/__init__.py",
    "core/__init__.py",
    "core/sim/__init__.py",
    "core/sim/backend.py",
    "core/sim/ngspice_adapter.py",
    "core/sim/result.py",
    "ui/qml/Main.qml",
    "tests/conftest.py",
    "tests/core/sim/test_ngspice_rc.py",
    "tests/core/sim/test_result.py",
    "tests/ui/test_main_window.py",
    "CLAUDE.md",
]

[tool.setuptools.packages.find]
include = ["app*", "core*", "bridge*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ngspice: test needs the ngspice shared library (skipped when it is missing)",
]
