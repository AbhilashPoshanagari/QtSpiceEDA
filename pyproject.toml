[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtspice"
version = "0.1.0"
description = "QtSpice: a small desktop EDA app (netlists, ngspice, waveforms, function blocks)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6~=6.8.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "jsonschema>=4.20",
]

[project.scripts]
qtspice = "app.__main__:main"

# Lets Qt Creator open this file as a project. Add new source files here.
