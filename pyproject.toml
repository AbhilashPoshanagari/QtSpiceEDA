[tool.setuptools.packages.find]
include = ["app*", "core*", "bridge*"]

[tool.setuptools.package-data]
"core.project" = ["schema.json"]
"core.symbols" = ["builtin/*.asy"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ngspice: test needs the ngspice shared library (skipped when it is missing)",
    "benchmark: timing test (skipped when the CI environment variable is set)",
]
