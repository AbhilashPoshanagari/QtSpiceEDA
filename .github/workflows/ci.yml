name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libngspice0 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install libngspice

      # Windows uses third_party/ngspice/lib/ngspice.dll when it is committed;
      # otherwise the ngspice tests are skipped there.

      - name: Install Python packages
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q -rs
