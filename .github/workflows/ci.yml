name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Windows packages bundle the official 64-bit ngspice DLL from SourceForge.
  NGSPICE_VERSION: "44.2"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libngspice0 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install libngspice

      # Windows uses third_party/ngspice/lib/ngspice.dll when it is committed;
      # otherwise the ngspice tests are skipped there.

      - name: Install Python packages
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q -rs

  # v0.3 spikes (scratch/phase3): ngspice sync API, rejected steps, child process,
  # mass-spring-damper mapping and locale, on every OS. Results go to the job log.
  spikes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngspice and a German locale (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libngspice0 locales libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
          sudo locale-gen de_DE.UTF-8

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install libngspice

      - name: Get ngspice (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          url="https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}_dll_64.7z/download"
          curl -L --fail --retry 3 -o ngspice.7z "$url"
          7z x ngspice.7z -ongspice-dll > /dev/null
          dll=$(find ngspice-dll -iname ngspice.dll | head -n 1)
          test -n "$dll" || { echo "ngspice.dll not found in the download"; exit 1; }
          cp "$(dirname "$dll")"/*.dll third_party/ngspice/lib/

      - name: Install Python packages
        run: python -m pip install -e ".[dev]"

      - name: Spike tests
        run: pytest -q -rs -s scratch/phase3

      - name: Spike reports
        run: |
          python scratch/phase3/spike1_external.py 100 10
          python scratch/phase3/spike2_redo.py
          python scratch/phase3/spike3_child.py
          python scratch/phase3/spike4_msd.py
          python scratch/phase3/spike5_locale.py

  # v0.4 spikes (scratch/phase4): DSS-Python install, contexts and child process,
  # PyInstaller one-file build, API coverage, locale and timing, on every OS.
  # Results go to the job log.
  spikes-grid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: German locale (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8

      - name: Install Python packages
        run: python -m pip install -e ".[dev,grid]"

      - name: Spike tests
        run: pytest -q -rs -s scratch/phase4

      - name: Spike reports
        run: |
          python scratch/phase4/spike1_install.py
          python scratch/phase4/spike2_contexts.py
          python scratch/phase4/spike3_pyinstaller/build.py
          python scratch/phase4/spike4_api.py
          python scratch/phase4/spike5_locale.py
          python scratch/phase4/spike6_timing.py

  # Build the installable apps (PyInstaller one-folder builds) and upload them.
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get ngspice (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          url="https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}_dll_64.7z/download"
          curl -L --fail --retry 3 -o ngspice.7z "$url"
          7z x ngspice.7z -ongspice-dll > /dev/null
          dll=$(find ngspice-dll -iname ngspice.dll | head -n 1)
          test -n "$dll" || { echo "ngspice.dll not found in the download"; exit 1; }
          cp "$(dirname "$dll")"/*.dll third_party/ngspice/lib/
          ls -l third_party/ngspice/lib

      - name: Get ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install libngspice

      - name: Get ngspice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libngspice0 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Install Python packages
        run: python -m pip install -e ".[dev,grid]"

      - name: Build
        run: pyinstaller --noconfirm packaging/qtspice-${{ matrix.platform }}.spec

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/QtSpice -DestinationPath QtSpice-windows.zip

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/QtSpice.app QtSpice-macos.zip

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf QtSpice-linux.tar.gz QtSpice

      - uses: actions/upload-artifact@v4
        with:
          name: QtSpice-${{ matrix.platform }}
          path: QtSpice-${{ matrix.platform }}.*
          if-no-files-found: error

  # Run the packaged app on a fresh runner that has no Python packages and no ngspice
  # installed: it must load its QML, simulate the bundled RC example with its own
  # ngspice, run a block diagram and save/reopen a project.
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QtSpice-${{ matrix.platform }}

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive QtSpice-windows.zip -DestinationPath app
          if (Get-Command ngspice -ErrorAction SilentlyContinue) { throw "ngspice is installed" }
          $p = Start-Process -FilePath app/QtSpice/QtSpice.exe `
                 -ArgumentList "--smoke-test", "--report", "smoke.txt" -Wait -PassThru
          Get-Content smoke.txt
          exit $p.ExitCode

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -x -k QtSpice-macos.zip app
          if ls /opt/homebrew/lib/libngspice* /usr/local/lib/libngspice* 2>/dev/null; then
            echo "ngspice is installed"; exit 1
          fi
          status=0
          app/QtSpice.app/Contents/MacOS/QtSpice --smoke-test --report smoke.txt || status=$?
          cat smoke.txt
          exit $status

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Only what a desktop Linux already has (OpenGL/EGL, fonts, keyboard); no ngspice.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
          if ldconfig -p | grep -q libngspice; then echo "ngspice is installed"; exit 1; fi
          mkdir app && tar -C app -xzf QtSpice-linux.tar.gz
          status=0
          app/QtSpice/QtSpice --smoke-test --report smoke.txt || status=$?
          cat smoke.txt
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ matrix.platform }}
          path: smoke.txt
          if-no-files-found: ignore
